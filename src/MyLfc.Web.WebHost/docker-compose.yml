# sql test
  sql-server-test:
    container_name: sql-server-test
    image: mcr.microsoft.com/mssql/server:2022-latest
    user: root
    ports:
      - "1444:1433"
    volumes:
      - d:\site\docker\sql\test\data:/var/opt/mssql/data:rw
      - d:\site\docker\sql\test\log:/var/opt/mssql/log:rw
    environment:
      SA_PASSWORD: "123qwe!Q"
      ACCEPT_EULA: "Y"
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "123qwe!Q" -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
# api prod
  api-prod:
    container_name: api-prod
    image: andrewparys/api-test:develop
    ports:
      - "5001:5001"
    volumes:
      - d:/site/docker/api/test/wwwroot:/app/wwwroot
      - d:/site/docker/api/test/config:/app/config
      - d:/site/docker/api/test/logs:/app/logs
#      - /home/prod/wwwroot:/app/wwwroot
 #     - /home/prod/config:/app/config
  #    - /home/prod/logs:/app/logs
    environment:
      - ASPNETCORE_ENVIRONMENT=Release
      - ASPNETCORE_URLS=http://+:5001;
